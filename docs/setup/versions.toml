# Machine-readable pinned versions, read by `uv run shop doctor`.
# Keep in sync with docs/setup/VERSIONS.md (the human-readable source of truth, with sources and dates).
# Status: APPROVED 2026-10-28 (Task 0.2), verified 2026-10-28.

[stack]
odoo_image = "odoo:19.0-20261015"
odoo_image_python = "3.12"
postgres_image = "postgres:16.15-trixie"
elasticsearch_image = "docker.elastic.co/elasticsearch/elasticsearch:9.5.5"
kibana_image = "docker.elastic.co/kibana/kibana:9.5.5"
elasticsearch_version = "9.5.5"
elasticsearch_client = "9.5.1"
elastic_license = "basic"

[python]
host = "3.12"

[tools.git]
min = "2.40"

[tools.git_lfs]
min = "3.0"

[tools.gh]
min = "2.40"
severity = "warn"

[tools.uv]
min = "0.13.6"

[tools.docker_desktop]
min = "4.60"

[tools.docker_engine]
min = "27.0"

[tools.docker_compose]
min = "2.20"

[tools.wsl]
min = "2.0"

[machine]
ram_gb_recommended = 16
ram_gb_min = 8
disk_free_gb_warn = 50
disk_free_gb_fail = 20
vm_max_map_count_min = 262144

[machine.docker_memory_gb]
lowmem = 5
standard = 8

[ports]
required_free = [8069, 8072, 9200, 5601, 8089]

# Datasets (ADR-012, docs/setup/VERSIONS.md §4). Read by `uv run shop data fetch` and the doctor's `data` section.
# Parquet sizes and SHA-256 come from the Git LFS pointer files at the pinned commit (checked 2026-11-14);
# sources.csv is a plain git file, its SHA-256 computed from the pinned commit the same day.
[datasets.esci]
repository = "amazon-science/esci-data"
commit = "7916cdf6ab75a462e77f20ab40428a10923998d5"  # pragma: allowlist secret
folder = "shopping_queries_dataset"
license = "Apache-2.0"

[[datasets.esci.files]]
name = "shopping_queries_dataset_examples.parquet"
lfs = true
size_bytes = 51286808
sha256 = "4a735b693b4a424a6fc67f5be6e4c811495c488bbf66d02a602d308b2744263a"  # pragma: allowlist secret

[[datasets.esci.files]]
name = "shopping_queries_dataset_products.parquet"
lfs = true
size_bytes = 1108857465
sha256 = "25124442d064d64b26f74082d6fa09438d679efc0c183cf28d19064a2b65a265"  # pragma: allowlist secret

[[datasets.esci.files]]
name = "shopping_queries_dataset_sources.csv"
lfs = false
size_bytes = 1682802
sha256 = "a5fed8ecc016443de40bf3c63098f0e3f23bbe4daa4236f1c38b8c3184778c50"  # pragma: allowlist secret
