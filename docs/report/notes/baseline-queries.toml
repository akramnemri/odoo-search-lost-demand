# Hand-picked queries for Task 2.5 (`uv run shop eval baseline-search`). DEV DATA ONLY: no test query and no
# product judged for a test query (checked by the script). Chosen on 2026-11-15 AFTER measuring all 300 dev
# queries, to illustrate each kind of failure; how often each kind occurs is in the same generated table.
# group: typo, vocabulary, plural, brand, long. control: the query without the problem under study.

[[query]]
group = "typo"
query = "theottle cable"
control = "throttle cable"
expected = ["B002ET2O2W", "B0055DPJJE", "B00D9TI6WI", "B01MD12TXA", "B01MXD17JN", "B07FXNPCGS", "B07M5RVMNL", "B07Q5NXR7W", "B07T1NYV7Z", "B087F61M7M"]
source = "dev query 102547 (real ESCI shopper query); expected = its Exact products"
why = "One wrong letter: every word must appear in the product text, so nothing matches."

[[query]]
