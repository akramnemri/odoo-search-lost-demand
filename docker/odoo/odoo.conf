; Development configuration of the shop. No secrets here: the placeholders are filled from the container
; environment at start by docker/odoo/entrypoint.sh (docs/ai/01_ARCHITECTURE.md §12).
; Database connection: PGHOST, PGPORT, PGUSER, PGPASSWORD (environment, read by Odoo directly; never on the command line).
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = ${ODOO_ADMIN_PASSWD}
; One fixed database; the database manager and the database list are disabled.
db_name = ${ODOO_DB_NAME}
dbfilter = ^${ODOO_DB_NAME}$$
list_db = False
; 0 = threaded server for development and debugging; load tests use workers (docs/ai/01_ARCHITECTURE.md §5.3).
workers = 0
proxy_mode = False
log_level = info
