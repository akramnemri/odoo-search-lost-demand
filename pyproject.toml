[project]
name = "shoptools"
version = "0.1.0"
description = "Command-line tools for the Odoo search and lost-demand project: doctor, data, import, replay, evaluation"
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING"]
# Same Python minor as the pinned Odoo image (ADR-011, docs/setup/VERSIONS.md).
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
shop = "shoptools.cli:main"

# Other groups (load, eval, semantic) are added by the task that first needs them.
[dependency-groups]
dev = [
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
]
# Reading the ESCI Parquet files (Task 2.1); docs/setup/VERSIONS.md §3.
data = [
  "pyarrow==26.0.0",
]

[tool.uv]
# `uv sync` installs both on the laptop and in CI; the data tools and their tests need pyarrow.
default-groups = ["dev", "data"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["tools", "addons/website_sale_lost_demand"]
extend-exclude = [".odoo-src", "data", "results", "local"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Odoo conventions: package __init__ files import submodules for their side effect (registering models,
# tests), and a manifest is a bare dict literal.
"addons/**/__init__.py" = ["F401"]
"addons/**/__manifest__.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
# The module's pure services/ are imported as `services` (they never import odoo): docs/ai/01 §6.1.
pythonpath = ["addons/website_sale_lost_demand"]
addopts = "-ra"
