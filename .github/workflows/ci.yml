# Quality gate for every pull request and for the protected branches (docs/ai/03_GIT_TESTING_PIPELINE.md §12).
# `compose` and `module` (Task 1.5) run the real compose.yaml stack, not separate service containers, so CI tests
# the same Elasticsearch users, roles and settings as the laptop (ADR-003, supervisor decision 2026-11-14).
# Actions are pinned to full commit SHAs (tag in the comment), checked on 2026-10-28.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the pre-commit quality gate
        run: uv run shop lint

  tools:
    # Windows too: it is the development machine, and the doctor has Windows-only code paths.
    name: tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Run the tools tests
        run: uv run pytest

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      # compose.yaml requires its variables (`${VAR:?...}`); the generated values are throwaway and never printed.
      - name: Create a throwaway .env
        run: uv run shop env init --profile lowmem
      - name: Validate compose.yaml
        run: docker compose config --quiet

  module:
    # Installs the module on a fresh database `shop_test` and runs all its tests, including the `es` ones,
    # against the real stack without Kibana (`shop up --no-kibana`, `shop test module --es`).
    name: module
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=1048576
      - name: Create a throwaway .env
        run: uv run shop env init --profile lowmem
      # `shop up` never pulls by itself (no surprise downloads on the laptop); CI pulls explicitly.
      - name: Pull the pinned images and build the Odoo image
        run: |
          docker compose pull --quiet db elasticsearch es-setup
          docker compose build odoo
      - name: Start the stack (without Kibana)
        run: uv run shop up --no-kibana
      - name: Run the module tests (unit + es)
        run: uv run shop test module --es
      - name: Show the stack state and logs
        if: failure()
        run: |
          uv run shop status || true
          tail -n 150 local/logs/test-module.log || true
          docker compose logs --no-color --tail 80 es-setup elasticsearch odoo || true
