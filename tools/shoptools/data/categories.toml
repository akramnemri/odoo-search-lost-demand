# Synthetic shop categories for the ESCI catalog slice (Task 2.3b, docs/ai/04_DATA_SEARCH_EVALUATION.md §4).
# ESCI has no categories: these are keyword rules, SYNTHETIC like prices, stock and vendors.
#
# Matching (tools/shoptools/data/enrichment.py, assign_category): title and bullet points are normalized, split into
# words of letters and digits, and folded to a simple singular ("shoes" -> "shoe", "boxes" -> "box"). A keyword
# (or a phrase of several words) scores 3 per category when it appears in the title and 1 when it appears only in the
# bullet points. The best score wins; a tie goes to the category listed first. No keyword at all -> "Other".
#
# Price: log-normal per category, median `price_median` (USD) and spread `price_sigma`, bounded by [prices] in
# slice.toml, ending in .99. Rough orders of magnitude for a small online shop, not market data.
#
# The keyword lists were written by reading only the titles of products judged for DEV queries (never test queries).
# Words that mean different things in different categories ("case", "light", "cover", "switch") appear only inside
# phrases. Order matters for ties: specific categories come before broad ones.

